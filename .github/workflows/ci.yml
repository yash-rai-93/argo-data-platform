name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual data workflow and shell scripts
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/rebuild-data.yml

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check --diff .
      - run: uv run ruff check .
      - run: uv run pytest -v
      - name: Validate recent activity checkpoint
        run: uv run python -m etl.refresh_activity --validate-only
      # The committed historical warehouse makes these checks credential-free.
      - name: Validate dbt models and leakage checks
        working-directory: transform
        run: uv run dbt build --profiles-dir .
      - name: Lint dbt SQL
        working-directory: transform
        run: uv run sqlfluff lint models tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run lint
      - run: npm run build
      - name: Install community-report browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/argo-community-browser" --no-save --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/argo-community-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify all community report pages and filters
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/community-server.log" 2>&1 &
          ready=false
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:3000/community > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/community-server.log"; exit 1; fi
          NODE_PATH="$RUNNER_TEMP/argo-community-browser/node_modules" COMMUNITY_URL="http://127.0.0.1:3000" COMMUNITY_OUTPUT="$RUNNER_TEMP/community-report-results" node ../tests/community_browser.cjs
      - name: Retain community report screenshots and server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-report-verification
          path: |
            ${{ runner.temp }}/community-report-results
            ${{ runner.temp }}/community-server.log
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t argo-check .
      - name: Verify warehouse, models, and API
        run: |
          docker run -d --name argo-check --memory=512m --cpus=1 -p 7860:7860 argo-check
          for i in $(seq 1 120); do
            if curl -fs --max-time 2 http://localhost:7860/health > /dev/null; then
              docker exec argo-check python -m api.smoke_test
              docker stats --no-stream --format 'Memory after smoke: {{.MemUsage}}' argo-check
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs argo-check
      - name: Clean up
        if: always()
        run: docker rm -f argo-check || true
