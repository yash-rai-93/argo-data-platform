name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Overlapping revisions of the same service race, and
# Cloud Run resolves the tie by wall-clock arrival rather than commit order.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$GCP_SA_KEY" ] && missing="$missing GCP_SA_KEY(secret)"
          [ -z "$GCP_PROJECT_ID" ] && missing="$missing GCP_PROJECT_ID(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing configuration:$missing"
            echo "Set them under Settings > Secrets and variables > Actions."
            echo "  GCP_SA_KEY      secret,   the service account JSON key, pasted whole"
            echo "  GCP_PROJECT_ID  variable, your Google Cloud project id"
            exit 1
          fi

      # gcloud ships preinstalled on GitHub-hosted ubuntu runners, so no
      # marketplace action is needed to authenticate or deploy.
      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          gcloud config set project "$GCP_PROJECT_ID"

      # --source hands the repository to Cloud Build, which builds the
      # Dockerfile in Google's infrastructure and pushes to Artifact Registry.
      # Building in the runner instead would mean authenticating Docker against
      # the registry and pushing 2.5GB over the public internet on every commit.
      #
      # --memory 1Gi: the container was measured at 223MiB after the lifespan
      # warm-up and 229MiB peak with every endpoint exercised, so this is ~4x
      # headroom rather than a guess. Cloud Run bills GiB-seconds, so
      # over-provisioning burns the free tier for nothing.
      #
      # --cpu-boost shortens the cold start, which is dominated by loading two
      # boosters and computing the Breslow baseline over the 2,426-row training
      # split before the first request is served.
      - name: Deploy
        env:
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'argo-api' }}
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --cpu-boost \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 120 \
            --quiet

          url=$(gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" --format 'value(status.url)')
          echo "Deployed to $url"
          echo "### Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the live revision
        env:
          GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'argo-api' }}
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" --format 'value(status.url)')
          for path in /health /api/v1/metrics/executive /api/v1/predict/registry; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done
