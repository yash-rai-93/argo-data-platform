name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            version="sha-$(git rev-parse --short HEAD)"
          fi
          echo "image=ghcr.io/${OWNER,,}/argo-backend" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          docker build \
            -t "${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}" \
            -t "${{ steps.tags.outputs.image }}:latest" .
      - name: Verify image before publishing
        run: |
          docker run -d --name argo-check --memory=512m --cpus=1 -p 7860:7860 \
            "${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
          for i in $(seq 1 120); do
            if curl -fs --max-time 2 http://localhost:7860/health > /dev/null; then
              docker exec argo-check python -m api.smoke_test
              docker stats --no-stream --format 'Memory after smoke: {{.MemUsage}}' argo-check
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs argo-check
      - name: Clean up
        if: always()
        run: docker rm -f argo-check || true
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Push verified image
        run: docker push --all-tags "${{ steps.tags.outputs.image }}"
