name: Data maintenance (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Estimate or apply a recent refresh, or rebuild historical training artifacts
        type: choice
        options: [incremental-dry-run, incremental-refresh, backfill-dry-run, backfill-refresh, pilot-dry-run, pilot-refresh, dry-run, rebuild]
        default: incremental-dry-run
      maximum_bytes_billed:
        description: "Required for apply/rebuild: positive bytes cap; recent refresh maximum 20000000000"
        type: string
        required: false

      refresh_end:
        description: "Recent/backfill end date, exclusive UTC (YYYY-MM-DD); copy from estimate"
        type: string
        required: false

# Queue maintenance runs; never cancel a writer halfway through a snapshot.
concurrency:
  group: argo-data-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rebuild:
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'dry-run' || inputs.operation == 'rebuild')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      BIGQUERY_LOCATION: US
      OPERATION: ${{ inputs.operation }}
      BIGQUERY_MAX_BYTES_BILLED: ${{ inputs.maximum_bytes_billed }}
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ETL_SERVICE_ACCOUNT: ${{ vars.GCP_ETL_SERVICE_ACCOUNT }}
        run: |
          test -n "$GOOGLE_CLOUD_PROJECT" || { echo "Set GCP_PROJECT_ID"; exit 1; }
          test -n "$WIF_PROVIDER" || { echo "Set GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$ETL_SERVICE_ACCOUNT" || { echo "Set GCP_ETL_SERVICE_ACCOUNT"; exit 1; }
          if [ "$OPERATION" = "rebuild" ]; then
            [[ "$BIGQUERY_MAX_BYTES_BILLED" =~ ^[1-9][0-9]*$ ]] || {
              echo "Rebuild requires a positive maximum_bytes_billed input"
              exit 1
            }
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Authenticate for extraction
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ETL_SERVICE_ACCOUNT }}
      - name: Estimate scan
        if: inputs.operation == 'dry-run'
        run: uv run python -m etl.land_github_data --dry-run
      - name: Extract with billing cap
        if: inputs.operation == 'rebuild'
        run: uv run python -m etl.land_github_data --maximum-bytes-billed "$BIGQUERY_MAX_BYTES_BILLED"
      - name: Build and validate warehouse
        if: inputs.operation == 'rebuild'
        working-directory: transform
        run: uv run dbt build --profiles-dir .
      - name: Rebuild matching models and supporting tables
        if: inputs.operation == 'rebuild'
        run: |
          uv run python -m etl.ingest_dbt_artifacts
          uv run python -m ml.train_classifier
          uv run python -m ml.train_churn
          uv run python -m ml.evaluate_model
          uv run python -m ml.decompose_activity
          uv run pytest
      - name: Verify rebuilt API
        if: inputs.operation == 'rebuild'
        run: |
          uv run uvicorn api.main:app --host 127.0.0.1 --port 7860 > /tmp/argo-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fs --max-time 2 http://localhost:7860/health > /dev/null; then
              uv run python -m api.smoke_test
              exit 0
            fi
            sleep 1
          done
          cat /tmp/argo-api.log
          exit 1
      - name: Record artifact provenance
        if: inputs.operation == 'rebuild'
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          paths = [
              Path("transform/argo.duckdb"),
              *sorted(Path("ml/models").glob("*.json")),
              Path("frontend/public/assets/survival_curves.png"),
              Path("frontend/public/assets/shap_summary.png"),
          ]
          metadata = {
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "source": "githubarchive.day.2023*",
              "window": "[2023-07-01, 2024-01-01)",
              "sha256": {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in paths
              },
          }
          Path("argo-artifacts.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      # Upload exact paths only: auth writes a temporary credential file at root.
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'rebuild'
        with:
          name: argo-historical-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            transform/argo.duckdb
            ml/models/*.json
            frontend/public/assets/survival_curves.png
            frontend/public/assets/shap_summary.png
            argo-artifacts.json

  recent-activity:
    if: github.ref == 'refs/heads/main' && (startsWith(inputs.operation, 'incremental-') || startsWith(inputs.operation, 'backfill-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CAP: ${{ inputs.maximum_bytes_billed }}
      END_DATE: ${{ inputs.refresh_end }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check configuration and pending refresh
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ETL_SERVICE_ACCOUNT: ${{ vars.GCP_ETL_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$WIF_PROVIDER"
          test -n "$ETL_SERVICE_ACCOUNT"
          # A newer main would make GITHUB_SHA provenance inaccurate.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "Main advanced after dispatch. Start a fresh run."; exit 1;
          }
          pending=$(git ls-remote --heads origin refs/heads/data/manual-refresh | cut -f1)
          echo "PENDING_SHA=$pending" >> "$GITHUB_ENV"
          if [ -n "$pending" ]; then
            git fetch origin refs/heads/data/manual-refresh
            git diff --quiet HEAD FETCH_HEAD -- data/recent-activity.json data/recent-activity-state.json.gz || {
              echo "A refresh is awaiting promotion. Merge its data PR, or delete the data/manual-refresh branch to discard it, before querying again."
              exit 1
            }
          fi
          if [[ "$OPERATION" = *-refresh ]]; then
            if [[ "$CAP" =~ ^[1-9][0-9]{0,10}$ ]] && (( CAP <= 20000000000 )); then
              echo "Explicit query cap: $CAP bytes"
            else
              echo "Set a positive cap of at most 20000000000 bytes after reviewing the estimate."
              exit 1
            fi
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run python -m etl.refresh_activity --validate-only
      # Same workflow path and main ref as the existing narrow WIF trust.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ETL_SERVICE_ACCOUNT }}
      - name: Estimate or refresh recent activity
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$OPERATION" = backfill-* ]]; then args+=(--backfill); fi
          if [ -n "$END_DATE" ]; then args+=(--end-date "$END_DATE"); fi
          if [[ "$OPERATION" = *-refresh ]]; then
            args+=(--apply --maximum-bytes-billed "$CAP")
          fi
          uv run python -m etl.refresh_activity "${args[@]}"
      - name: Validate and publish a data review branch
        if: inputs.operation == 'incremental-refresh' || inputs.operation == 'backfill-refresh'
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m etl.refresh_activity --validate-only
          uv run pytest
          if git diff --quiet -- data/recent-activity.json; then
            echo "No new checkpoint; no branch or deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest_main=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$latest_main" = "$GITHUB_SHA" || {
            echo "Main advanced. No branch published; rerun against current main."; exit 1;
          }
          git switch -c data/manual-refresh
          git add -- data/recent-activity.json data/recent-activity-state.json.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh recent GitHub activity (run $GITHUB_RUN_ID)"
          # Replace only the dedicated data branch, with an explicit lease.
          git push "--force-with-lease=refs/heads/data/manual-refresh:$PENDING_SHA" origin HEAD:refs/heads/data/manual-refresh
          {
            echo "### Review and deploy"
            echo ""
            echo "Open a pull request from the data branch, let CI pass, then merge it:"
            echo "https://github.com/$GITHUB_REPOSITORY/compare/main...data/manual-refresh?expand=1"
            echo ""
            echo "The approved cursor advances only when these two files reach main. A visitor never triggers BigQuery."
          } >> "$GITHUB_STEP_SUMMARY"

  pilot-activity:
    if: github.ref == 'refs/heads/main' && startsWith(inputs.operation, 'pilot-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GCS_BUCKET: ${{ vars.GCP_DATA_BUCKET }}
      CAP: ${{ inputs.maximum_bytes_billed }}
      END_DATE: ${{ inputs.refresh_end }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - name: Check pilot configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ETL_SERVICE_ACCOUNT: ${{ vars.GCP_ETL_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_CLOUD_PROJECT"
          test -n "$WIF_PROVIDER"
          test -n "$ETL_SERVICE_ACCOUNT"
          test -n "$END_DATE" || { echo "Set an explicit refresh_end copied between estimate and apply."; exit 1; }
          if [ "$OPERATION" = pilot-refresh ]; then
            test -n "$GCS_BUCKET" || { echo "Set GCP_DATA_BUCKET to an existing private US bucket."; exit 1; }
            if [[ "$CAP" =~ ^[1-9][0-9]{0,10}$ ]] && (( CAP <= 20000000000 )); then
              echo "Explicit per-query cap: $CAP bytes"
            else
              echo "Set a positive maximum_bytes_billed of at most 20000000000."; exit 1
            fi
          fi
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Validate the versioned scope and 90-day batch plan
        run: uv run python -m etl.pilot_activity --plan-only --days 90 --end-date "$END_DATE"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ETL_SERVICE_ACCOUNT }}
      - name: Estimate or land the isolated seven-day pilot
        run: |
          set -euo pipefail
          args=()
          if [ "$OPERATION" = pilot-refresh ]; then
            args+=(--apply --maximum-bytes-billed "$CAP")
          fi
          uv run python -m etl.pilot_activity --end-date "$END_DATE" --report data/generated/pilot-report.json "${args[@]}"
          {
            echo '### 500-repository pilot'
            echo
            echo 'This run does not publish or advance the production dashboard.'
            echo
            echo '```json'
            cat data/generated/pilot-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: argo-pilot-${{ github.run_id }}
          path: data/generated/pilot-report.json
          if-no-files-found: error
          retention-days: 14
