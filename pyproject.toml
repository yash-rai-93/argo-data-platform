[project]
name = "argo"
version = "0.1.0"
description = "Product- and decision-intelligence analytics platform (portfolio project)."
requires-python = ">=3.12"
dependencies = [
    "faker>=40.31.0",
    "fastapi>=0.139.2",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.51.0",
    "xgboost>=3.3.0",
]

# Console entry point for the synthetic-event generator.
[project.scripts]
argo-gen = "generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

# Development toolchain. Pinned floors here; exact versions live in uv.lock.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "sqlfluff>=3.3",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.10.1",
    "sqlfluff-templater-dbt>=4.2.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Sensible, non-noisy default: pyflakes, pycodestyle, isort, bugbear, pyupgrade, comprehensions.
select = ["E", "F", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
