version: 2

models:
  - name: dim_users
    description: One row per user with lifespan bounds and current attributes.
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null

  - name: dim_accounts
    description: One row per account with team size, lifespan, and current plan.
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
