version: 2

models:
  - name: metric_active_users
    description: Daily DAU with rolling 7-day WAU and 30-day MAU.
    columns:
      - name: activity_date
        data_tests:
          - unique
          - not_null

  - name: metric_mrr
    description: Monthly recurring revenue and annualised ARR.
    columns:
      - name: revenue_month
        data_tests:
          - unique
          - not_null

  - name: metric_retention_cohorts
    description: N-day retention by signup-day cohort.
    columns:
      - name: cohort_date
        data_tests:
          - unique
          - not_null
